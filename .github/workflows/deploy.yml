name: Deploy

# Reusable workflow, called by each service's CI workflow once its
# build-and-test job (tests + SonarQube quality gate) has succeeded.
on:
  workflow_call:
    inputs:
      service:
        description: Compose service to rebuild and restart
        required: true
        type: string

# One deploy at a time on the server; queued deploys wait instead of being cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ${{ inputs.service }} to Hetzner server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git checkout main
            git merge --ff-only ${{ github.sha }}
            docker compose up -d --build ${{ inputs.service }}
