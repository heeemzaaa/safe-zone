name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find which services changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | cut -d/ -f1 | sort -u)
          SERVICES=""
          for s in api-gateway discovery-server user-service product-service media-service frontend; do
            if echo "$CHANGED" | grep -qx "$s"; then
              SERVICES="$SERVICES $s"
            fi
          done
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hetzner server
        if: steps.changes.outputs.services != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull
            docker compose up -d --build ${{ steps.changes.outputs.services }}
