name: API Gateway CI

on:
  pull_request:
    paths:
      - 'api-gateway/**'
  push:
    paths:
      - 'api-gateway/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate self-signed keystore for CI
        run: |
          keytool -genkeypair \
            -alias gateway \
            -keyalg RSA \
            -keysize 2048 \
            -storetype PKCS12 \
            -keystore src/main/resources/keystore.p12 \
            -validity 3650 \
            -dname "CN=localhost, OU=CI, O=Vendify" \
            -storepass "${{ secrets.SSL_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.SSL_KEYSTORE_PASSWORD }}"

      - name: Build and test
        env:
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B verify

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.projectKey=api-gateway
          -Dsonar.qualitygate.wait=true

  # Deploy only after build, tests and the SonarQube quality gate have passed,
  # and only for pushes to main (never for pull requests or other branches).
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      service: api-gateway
    secrets: inherit
